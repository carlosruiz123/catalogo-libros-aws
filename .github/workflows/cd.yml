name: CD - Publicar imagen y desplegar en EC2

on:
  push:
    branches: [main]

jobs:
  test:
    name: Ejecutar pruebas antes de construir
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con Jest y Supertest
        run: npm test

  build_and_push:
    name: Construir y publicar imagen Docker en GHCR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Construir y publicar imagen etiquetada con el SHA del commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/carlosruiz123/catalogo-libros-aws:${{ github.sha }}
            ghcr.io/carlosruiz123/catalogo-libros-aws:latest

  deploy:
    name: Desplegar contenedor en EC2 y verificar salud
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Autorizar IP temporal del runner para SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"
          sleep 3

      - name: Desplegar nueva version en EC2 con verificacion y rollback
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${GHCR_TOKEN}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${EC2_USER}@${EC2_HOST}" "
            set -euo pipefail
            IFS= read -r TOKEN_STDIN
            echo \"\$TOKEN_STDIN\" | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin

            NEW_IMAGE=\"ghcr.io/carlosruiz123/catalogo-libros-aws:${IMAGE_TAG}\"
            docker pull \"\$NEW_IMAGE\"

            docker rm -f catalogo-libros-api-prev >/dev/null 2>&1 || true
            HAD_PREV=0
            if docker ps -a --format '{{.Names}}' | grep -qx 'catalogo-libros-api'; then
              docker stop catalogo-libros-api >/dev/null 2>&1 || true
              docker rename catalogo-libros-api catalogo-libros-api-prev
              HAD_PREV=1
            fi

            docker run -d \
              --name catalogo-libros-api \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file /opt/catalogo-libros/.env \
              -e COMMIT_SHA=\"${IMAGE_TAG}\" \
              \"\$NEW_IMAGE\"

            OK=0
            for i in \$(seq 1 15); do
              if curl -sf http://127.0.0.1/health >/dev/null && curl -sf http://127.0.0.1/libros >/dev/null; then
                OK=1
                break
              fi
              sleep 2
            done

            if [ \"\$OK\" -ne 1 ]; then
              echo 'La nueva version no supero las verificaciones. Mostrando logs:'
              docker logs --tail 50 catalogo-libros-api || true
              docker rm -f catalogo-libros-api >/dev/null 2>&1 || true
              if [ \"\$HAD_PREV\" -eq 1 ]; then
                echo 'Restaurando contenedor anterior...'
                docker rename catalogo-libros-api-prev catalogo-libros-api
                docker start catalogo-libros-api
              fi
              exit 1
            fi

            echo 'Despliegue interno verificado:'
            curl -sS http://127.0.0.1/health
            echo ''
            if [ \"\$HAD_PREV\" -eq 1 ]; then
              docker rm -f catalogo-libros-api-prev >/dev/null 2>&1 || true
            fi
            docker image prune -f >/dev/null 2>&1 || true
          "

      - name: Verificar endpoints publicos a traves de Nginx
        run: |
          echo "=== /health ==="
          curl -sf "http://${{ secrets.EC2_HOST }}/health"
          echo ""
          echo "=== /libros ==="
          curl -sf "http://${{ secrets.EC2_HOST }}/libros"
          echo ""

      - name: Revocar acceso SSH temporal del runner
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
              --protocol tcp \
              --port 22 \
              --cidr "${RUNNER_IP}/32" || true
          fi
